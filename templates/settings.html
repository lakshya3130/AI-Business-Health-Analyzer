{% extends 'base.html' %}{% block title %}Settings · Business Health{% endblock %}{% block content %}<div class="page-heading"><div><div class="eyebrow">ACCOUNT</div><h1>Business settings</h1><p class="muted">Update your workspace profile.</p></div></div><article class="card" style="max-width:620px"><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Business name<input name="company_name" value="{{ company.company_name }}" maxlength="180" required></label><label>Industry<select name="industry" required>{% for option in ['Retail','Manufacturing','Food & Beverage','Professional Services','Other'] %}<option {% if company.industry==option %}selected{% endif %}>{{ option }}</option>{% endfor %}</select></label><div class="tiny muted">Account: {{ current_user.name }} · {{ current_user.email }}</div><button class="button primary">Save profile</button></form></article>{% endblock %}
